[project]
name = "kalkan-ai"
version = "0.1.0"
description = "Kalkan yapay zeka servisi: asistan (LLM + RAG), sınıflandırıcı, OCR ve URL modeli"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
strict = true
